name: STMAA Alpaca Paper BTC E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Shared across both Paper E2E workflows to prevent concurrent smoke orders.
  group: stmaa-alpaca-paper-broker-mutations
  cancel-in-progress: false

jobs:
  automated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run executor regression tests
        run: python -m pytest src/tests/test_broker_executor.py -q

  btc-paper-e2e:
    needs: automated-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run bounded BTC Paper E2E smoke test
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python scripts/alpaca_paper_btc_e2e_smoke.py
