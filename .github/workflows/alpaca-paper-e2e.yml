name: STMAA Alpaca Paper E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Shared across both Paper E2E workflows to prevent concurrent smoke orders.
  group: stmaa-alpaca-paper-broker-mutations
  cancel-in-progress: false

jobs:
  automated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Install locked project and test dependencies
        run: uv sync --locked --group dev
      - name: Run executor regression tests
        run: uv run --locked python -m pytest src/tests/test_broker_executor.py -q

  paper-e2e:
    needs: automated-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Install locked project and test dependencies
        run: uv sync --locked --group dev
      - name: Run bounded Paper E2E smoke test
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          uv run --locked python scripts/alpaca_paper_e2e_smoke.py
