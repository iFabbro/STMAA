name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The Intel runner has repeatedly received HTTP 504/timeouts from GitHub
      # Releases while setup-uv downloads its standalone binary. Install the
      # same pinned uv release from its PyPI wheel on this runner instead.
      - name: Install uv from PyPI (macOS Intel)
        if: matrix.os == 'macos-15-intel'
        run: python -m pip install --disable-pip-version-check uv==0.10.0

      - name: Set up uv
        if: matrix.os != 'macos-15-intel'
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Verify uv version
        run: uv --version

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Verify installed dependency consistency
        run: uv pip check

      - name: Run full cross-platform test suite
        run: uv run --locked pytest src/tests tests -q

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install development dependencies
        run: uv sync --locked --group dev

      - name: Ruff check
        run: uv run --locked ruff check .
