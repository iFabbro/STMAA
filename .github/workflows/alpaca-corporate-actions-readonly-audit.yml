name: STMAA Alpaca Corporate Actions Read-Only Audit

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Earliest corporate-action process date (YYYY-MM-DD)"
        required: false
        default: "2016-01-01"
      end_date:
        description: "Latest corporate-action process date (YYYY-MM-DD); blank means today"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: stmaa-alpaca-corporate-actions-readonly-audit
  cancel-in-progress: false

jobs:
  corporate-actions-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compare raw and fully adjusted historical bars
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          set -euo pipefail
          args=(--start-date "$START_DATE")
          if [[ -n "$END_DATE" ]]; then
            args+=(--end-date "$END_DATE")
          fi
          python scripts/alpaca_corporate_actions_readonly_audit.py "${args[@]}"
