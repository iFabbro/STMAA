name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Resolve or verify dependency lock
        id: lock
        run: |
          if [ -f uv.lock ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            uv lock --check
          else
            uv lock
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit bootstrapped lock file
        if: matrix.os == 'ubuntu-latest' && steps.lock.outputs.created == 'true' && github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "Add uv dependency lock file"
          git push origin "HEAD:$GITHUB_HEAD_REF"

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Verify installed dependency consistency
        run: uv pip check

      - name: Run full test suite (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: uv run --locked pytest src/tests tests -q

      - name: Run macOS regression suite
        if: matrix.os == 'macos-latest'
        run: >-
          uv run --locked pytest src/tests tests -q
          -k "not test_start_run_persists_verifiable_process_identity
          and not test_forcibly_terminated_process_run_is_recovered_as_failed
          and not test_orphan_recovery_preserves_another_live_process_run
          and not test_process_identity_mismatch_detects_pid_reuse
          and not test_process_restart_recovers_orphaned_session_as_failed_and_blocks_late_writes"

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Resolve or verify dependency lock
        run: |
          if [ -f uv.lock ]; then
            uv lock --check
          else
            uv lock
          fi

      - name: Install development dependencies
        run: uv sync --locked --group dev

      - name: Ruff check
        run: uv run --locked ruff check .
