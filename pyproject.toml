[project]
name = "stmaa"
version = "0.1.0"
description = "Experimental framework for systematic trading research and Alpaca Paper Trading"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alpaca-py>=0.28.0",
    "gymnasium==0.29.1",
    "numpy<2.0",
    "pandas",
    "pandas-market-calendars>=4.4.0",
    "plotly",
    "python-dotenv>=1.0.0",
    "requests",
    "stable-baselines3==2.3.2",
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch==2.13.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "soupsieve>=4.0,<5",
    "tabulate",
    "yfinance",
    "textual==8.2.8",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning:websockets\\.legacy\\.*"]

[tool.ruff]
target-version = "py312"
extend-exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E402", "E701", "B905"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
