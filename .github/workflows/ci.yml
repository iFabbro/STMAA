name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest src/tests -q 2>&1 | tee pytest.log

      # TEMPORANEO: posta in coda al log sulla PR se i test falliscono
      - name: Post test log on failure (debug)
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '```'; tail -n 70 pytest.log | cut -c1-300; echo '```'; } > body.md
          gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments -F body=@body.md
