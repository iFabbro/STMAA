name: STMAA Alpaca Paper BTC E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Shared across both Paper E2E workflows to prevent concurrent smoke orders.
  group: stmaa-alpaca-paper-broker-mutations
  cancel-in-progress: false

jobs:
  automated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Install locked project and test dependencies
        run: uv sync --locked --group dev
      - name: Run executor regression tests
        run: uv run --locked python -m pytest src/tests/test_broker_executor.py -q

  btc-paper-e2e:
    needs: automated-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Install locked project and test dependencies
        run: uv sync --locked --group dev
      - name: Run bounded BTC Paper E2E smoke test
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          uv run --locked python scripts/alpaca_paper_btc_e2e_smoke.py
