name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      # The Intel runner has repeatedly received HTTP 504/timeouts from GitHub
      # Releases while setup-uv downloads its standalone binary. Install the
      # same pinned uv release from its PyPI wheel on this runner instead.
      - name: Install uv from PyPI (macOS Intel)
        if: matrix.os == 'macos-15-intel'
        run: python -m pip install --disable-pip-version-check uv==0.10.0

      - name: Set up uv
        if: matrix.os != 'macos-15-intel'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Verify uv version
        run: uv --version

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        env:
          UV_HTTP_TIMEOUT: "120"
          UV_HTTP_RETRIES: "10"
        run: uv sync --locked --group dev

      - name: Verify installed dependency consistency
        run: uv pip check

      - name: Install pinned coverage tooling
        run: uv pip install --python .venv/bin/python pytest-cov==6.2.1 coverage==7.10.6

      - name: Run full cross-platform test suite with line and branch coverage
        run: >-
          uv run --locked --no-sync pytest src/tests tests -q
          --cov-config=pyproject.toml
          --cov
          --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install development dependencies
        run: uv sync --locked --group dev

      - name: Ruff check
        run: uv run --locked ruff check .
