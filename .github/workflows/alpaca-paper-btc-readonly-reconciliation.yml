name: STMAA Alpaca Paper BTC Read-Only Reconciliation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stmaa-alpaca-paper-btc-readonly-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Reconcile existing BTC Paper order and position (read-only)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          set -euo pipefail
          python scripts/alpaca_paper_btc_readonly_reconcile.py
