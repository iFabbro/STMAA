name: STMAA Alpaca Paper BTC Read-Only Reconciliation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stmaa-alpaca-paper-btc-readonly-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Install locked project and test dependencies
        run: uv sync --locked --group dev
      - name: Reconcile existing BTC Paper order and position (read-only)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          set -euo pipefail
          uv run --locked python scripts/alpaca_paper_btc_readonly_reconcile.py
